[models.logistic]
class = "sklearn.linear_model.LogisticRegression"
enabled = true

[models.logistic.fixed]
max_iter = 2000
solver = "lbfgs"

[models.logistic.search]
C = [0.01, 0.1, 1.0, 10.0]
class_weight = ["none", "balanced"]

[models.hist_gradient_boosting]
class = "sklearn.ensemble.HistGradientBoostingClassifier"
enabled = true

[models.hist_gradient_boosting.fixed]
early_stopping = false
max_iter = 100
l2_regularization = 1.0

[models.hist_gradient_boosting.search]
learning_rate = [0.1]
max_leaf_nodes = [7]

[models.catboost]
class = "catboost.CatBoostClassifier"
enabled = true

[models.catboost.fixed]
verbose = false
allow_writing_files = false
thread_count = 1
random_seed = 42

[models.catboost.search]
iterations = [150]
depth = [4, 6]
learning_rate = [0.05]
l2_leaf_reg = [3.0]

[models.random_forest]
class = "sklearn.ensemble.RandomForestClassifier"
enabled = true

[models.random_forest.fixed]
n_estimators = 300
n_jobs = 1
random_state = 42
class_weight = "balanced_subsample"

[models.random_forest.search]
max_depth = [4, 8]
min_samples_leaf = [10]
max_features = ["sqrt"]

[models.svm]
class = "sklearn.svm.SVC"
enabled = true

[models.svm.fixed]
probability = true
random_state = 42

[models.svm.search]
C = [0.5, 2.0]
gamma = ["scale"]
class_weight = ["balanced"]

[models.knn]
class = "sklearn.neighbors.KNeighborsClassifier"
enabled = true

[models.knn.fixed]
n_jobs = 1

[models.knn.search]
n_neighbors = [15, 35]
weights = ["distance"]
p = [2]

[models.naive_bayes]
class = "sklearn.naive_bayes.GaussianNB"
enabled = true

[models.naive_bayes.search]
var_smoothing = [1e-9, 1e-7]
