[models.random_forest]
class = "sklearn.ensemble.RandomForestClassifier"
enabled = true

[models.random_forest.fixed]
n_estimators = 300
n_jobs = -1
random_state = 42
class_weight = "balanced_subsample"
max_features = "sqrt"

[models.random_forest.search]
max_depth = [2, 3, 4]
min_samples_leaf = [5, 10, 20]
